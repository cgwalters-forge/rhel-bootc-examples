name: Build examples

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]
  # Weekly, so that base image tags going stale are noticed.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    # Only run the scheduled build upstream, not in forks.
    if: github.event_name != 'schedule' || github.repository_owner == 'redhat-cop'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      rhel: ${{ steps.rhel.outputs.available }}
    steps:
      - uses: actions/checkout@v4

      # Secrets are not passed to workflows triggered by PRs from forks,
      # and every example needs RHEL content, so skip the builds there.
      - name: Check for RHEL subscription secrets
        id: rhel
        env:
          RHT_ACT_KEY: ${{ secrets.RHT_ACT_KEY }}
          SOURCE_REGISTRY_USER: ${{ secrets.SOURCE_REGISTRY_USER }}
        run: |
          if [ -n "${RHT_ACT_KEY}" ] && [ -n "${SOURCE_REGISTRY_USER}" ]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::RHEL subscription secrets are unavailable (e.g. a PR from a fork); skipping the example builds"
            echo "available=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Find changed examples (PR only)
        if: github.event_name == 'pull_request'
        id: changed
        uses: tj-actions/changed-files@v46
        with:
          dir_names: true
          dir_names_max_depth: 1
          files_ignore: .github/**

      - name: Build matrix
        id: set-matrix
        env:
          EVENT: ${{ github.event_name }}
          CHANGED: ${{ steps.changed.outputs.all_changed_files }}
          WORKFLOW_CHANGED: ${{ contains(steps.changed.outputs.all_changed_files, '.github') }}
        run: |
          set -euo pipefail

          # Collect all examples (top-level dirs with a Containerfile),
          # excluding sealing (built by build-sealed.yml) and bootc-git (not
          # an example, but used by the composefs examples)
          all=()
          for d in */; do
            name="${d%/}"
            [ -f "$d/Containerfile" ] || continue
            case "$name" in sealing|bootc-git) continue ;; esac
            all+=("$name")
          done

          if [[ "${EVENT}" == "pull_request" && "${WORKFLOW_CHANGED}" != "true" ]]; then
            examples=()
            for name in ${CHANGED}; do
              for ex in "${all[@]}"; do
                [[ "${name}" == "${ex}" ]] && examples+=("${ex}")
              done
            done
          else
            examples=("${all[@]}")
          fi

          if [[ ${#examples[@]} -eq 0 ]]; then
            echo "No examples to build."
            echo 'matrix=[]' >> "${GITHUB_OUTPUT}"
          else
            json=$(printf '%s\n' "${examples[@]}" | jq -Rcs '[split("\n")[] | select(length>0)]')
            echo "matrix=${json}" >> "${GITHUB_OUTPUT}"
          fi

  build:
    needs: discover
    if: needs.discover.outputs.matrix != '[]' && needs.discover.outputs.rhel == 'true'
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJson(needs.discover.outputs.matrix) }}
    name: build / ${{ matrix.example }}
    runs-on: ubuntu-latest
    container:
      image: registry.access.redhat.com/ubi9/ubi
      options: --privileged
    env:
      SMDEV_CONTAINER_OFF: 1
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Register subscription
        run: subscription-manager register --org=${{ secrets.RHT_ORGID }} --activationkey=${{ secrets.RHT_ACT_KEY }}

      - name: Install build tools
        run: |
          dnf -y install podman
          curl -fsSL https://github.com/casey/just/releases/download/1.40.0/just-1.40.0-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C /usr/local/bin just

      - name: Log in to registry.redhat.io
        env:
          SOURCE_REGISTRY_USER: ${{ secrets.SOURCE_REGISTRY_USER }}
          SOURCE_REGISTRY_PASSWORD: ${{ secrets.SOURCE_REGISTRY_PASSWORD }}
        run: echo "${SOURCE_REGISTRY_PASSWORD}" | podman login registry.redhat.io -u "${SOURCE_REGISTRY_USER}" --password-stdin

      - name: Build ${{ matrix.example }}
        run: just build ${{ matrix.example }}

      - name: Unregister subscription
        if: always()
        run: subscription-manager unregister
