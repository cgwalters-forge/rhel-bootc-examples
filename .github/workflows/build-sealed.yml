name: Build sealed composefs host

on:
  push:
    branches: [main]
    paths:
      - 'sealing/**'
  pull_request:
    paths:
      - 'sealing/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HOST_IMAGE: ghcr.io/${{ github.repository }}/sealed-host

defaults:
  run:
    working-directory: sealing

jobs:
  build:
    name: Build sealed host
    runs-on: ubuntu-latest
    container:
      image: registry.access.redhat.com/ubi10/ubi
      options: --privileged --volume /var
    env:
      SMDEV_CONTAINER_OFF: 1
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Secrets are not passed to workflows triggered by PRs from forks.
      # Rather than failing, build against CentOS Stream there: that still
      # exercises the whole Containerfile.
      - name: Check for RHEL subscription secrets
        id: rhel
        env:
          RHT_ACT_KEY: ${{ secrets.RHT_ACT_KEY }}
          SOURCE_REGISTRY_USER: ${{ secrets.SOURCE_REGISTRY_USER }}
        run: |
          if [ -n "${RHT_ACT_KEY}" ] && [ -n "${SOURCE_REGISTRY_USER}" ]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
            echo "base=rhel" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::RHEL subscription secrets are unavailable (e.g. a PR from a fork); building against CentOS Stream instead"
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "base=centos-stream" >> "${GITHUB_OUTPUT}"
          fi

      - name: Register subscription
        if: steps.rhel.outputs.available == 'true'
        run: subscription-manager register --org=${{ secrets.RHT_ORGID }} --activationkey=${{ secrets.RHT_ACT_KEY }}

      - name: Install build tools
        run: |
          dnf -y install https://dl.fedoraproject.org/pub/epel/epel-release-latest-10.noarch.rpm
          dnf -y install podman just openssl

      - name: Log in to registry.redhat.io
        if: steps.rhel.outputs.available == 'true'
        env:
          SOURCE_REGISTRY_USER: ${{ secrets.SOURCE_REGISTRY_USER }}
          SOURCE_REGISTRY_PASSWORD: ${{ secrets.SOURCE_REGISTRY_PASSWORD }}
        run: echo "${SOURCE_REGISTRY_PASSWORD}" | podman login registry.redhat.io -u "${SOURCE_REGISTRY_USER}" --password-stdin

      # For non-PR builds with a real key, place it where the Justfile expects
      # it. Otherwise the Justfile generates an ephemeral key+cert itself.
      # (A step's `if:` can't see its own `env:`, so the check is in the script.)
      - name: Write db private key (non-PR builds only)
        if: github.event_name != 'pull_request'
        env:
          SECUREBOOT_DB_KEY: ${{ secrets.SECUREBOOT_DB_KEY }}
        run: |
          if [ -z "${SECUREBOOT_DB_KEY}" ]; then
            echo "SECUREBOOT_DB_KEY is not set; building with an ephemeral key"
          else
            mkdir -p target/keys
            printenv SECUREBOOT_DB_KEY > target/keys/sb-db.key
          fi

      - name: Build sealed host image
        run: just base=${{ steps.rhel.outputs.base }} build

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rhel.outputs.available == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push host image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rhel.outputs.available == 'true'
        run: podman push localhost/sealed-host:latest docker://${HOST_IMAGE}:latest

      - name: Unregister subscription
        if: always() && steps.rhel.outputs.available == 'true'
        run: subscription-manager unregister

      - name: Clean up keys
        if: always()
        run: rm -rf target/keys
